<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EBG HQ — Request Desk</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --bg:#080810; --bg2:#0d0d1a; --panel:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08); --cream:#EDE8E2; --cream-dim:rgba(237,232,226,0.55); --peri:#B8C9E8; --peri-dim:rgba(184,201,232,0.15); --success:#9ED4B4; --warn:#E8CDA0; }
    html,body { height:100%; background:var(--bg); color:var(--cream); font-family:'Jost',sans-serif; font-weight:300; }
    .layout { display:flex; min-height:100vh; }
    .sidebar { width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:32px 0 24px;position:sticky;top:0;height:100vh;overflow:auto; }
    .sidebar-mark { font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:var(--peri);padding:0 28px 28px;border-bottom:1px solid var(--border);margin-bottom:24px; }
    .sidebar-mark span { display:block;font-size:10px;color:var(--cream-dim);margin-top:2px;font-family:'Jost',sans-serif; }
    .nav-item { display:flex;align-items:center;gap:12px;padding:11px 28px;font-size:13px;color:var(--cream-dim);cursor:pointer;transition:all 0.15s;text-decoration:none;border-left:2px solid transparent; }
    .nav-item:hover { color:var(--cream);background:rgba(255,255,255,0.03); }
    .nav-item.active { color:var(--peri);border-left-color:var(--peri);background:var(--peri-dim); }
    .nav-icon { font-size:15px;width:18px;text-align:center; }
    .sidebar-spacer { flex:1; }
    .nav-signout { color:rgba(237,232,226,0.3);font-size:12px; }
    .main { flex:1;padding:48px 52px;overflow:auto; }
    .page-eyebrow { font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--peri);margin-bottom:10px; }
    .page-title { font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;margin-bottom:10px; }
    .page-title em { font-style:italic; }
    .page-sub { font-size:13px;color:var(--cream-dim);margin-bottom:40px;line-height:1.7; }

    /* New Request Form */
    .new-request-card { background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;margin-bottom:40px; }
    .card-title { font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--cream-dim);margin-bottom:24px; }
    .form-row { display:grid;grid-template-columns:1fr 200px;gap:16px;margin-bottom:16px; }
    .form-field { display:flex;flex-direction:column;gap:8px; }
    .form-field label { font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--cream-dim); }
    .form-field input, .form-field select, .form-field textarea { background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'Jost',sans-serif;font-size:13px;font-weight:300;color:var(--cream);outline:none;transition:border-color 0.2s; }
    .form-field input::placeholder,.form-field textarea::placeholder { color:rgba(237,232,226,0.3); }
    .form-field input:focus,.form-field select:focus,.form-field textarea:focus { border-color:var(--peri); }
    .form-field select option { background:#1a1a2e; }
    .form-field textarea { resize:vertical;min-height:120px; }
    .btn-submit { padding:12px 28px;background:var(--peri);color:#080810;border:none;border-radius:8px;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s;margin-top:4px; }
    .btn-submit:hover { opacity:0.85; }
    .btn-submit:disabled { opacity:0.4;cursor:not-allowed; }

    /* Request list */
    .requests-list { display:flex;flex-direction:column;gap:12px; }
    .request-card { background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px 26px; }
    .rc-header { display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px; }
    .rc-subject { font-size:15px;font-weight:400; }
    .rc-badge { display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;letter-spacing:0.06em;flex-shrink:0; }
    .badge-open      { background:rgba(184,201,232,0.15);color:var(--peri); }
    .badge-in_review { background:rgba(232,205,160,0.15);color:var(--warn); }
    .badge-resolved  { background:rgba(255,255,255,0.06);color:var(--cream-dim); }
    .rc-message { font-size:13px;color:var(--cream-dim);margin-bottom:8px;line-height:1.6; }
    .rc-meta { font-size:11px;color:rgba(237,232,226,0.35); }
    .type-chip { display:inline-block;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,0.05);font-size:10px;letter-spacing:0.06em;color:var(--cream-dim);margin-right:8px; }

    .section-heading { font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--cream-dim);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border); }
    .toast { position:fixed;bottom:32px;right:32px;padding:14px 22px;background:rgba(158,212,180,0.1);border:1px solid rgba(158,212,180,0.25);border-radius:10px;font-size:13px;color:var(--success);transform:translateY(80px);opacity:0;transition:all 0.3s;z-index:100; }
    .toast.show { transform:translateY(0);opacity:1; }

    @media (max-width:768px) { .sidebar{display:none;} .main{padding:32px 20px;} .form-row{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-mark">EBG HQ <span id="sidebarBiz">Brand HQ</span></div>
    <a class="nav-item" href="/hq/dashboard.html"><span class="nav-icon">◈</span> Home</a>
    <a class="nav-item" href="/hq/vault.html"><span class="nav-icon">⊞</span> Brand Vault</a>
    <a class="nav-item" href="/hq/roadmap.html"><span class="nav-icon">⊟</span> Roadmap</a>
    <a class="nav-item" href="/hq/approvals.html"><span class="nav-icon">✓</span> Approvals</a>
    <a class="nav-item active" href="/hq/requests.html"><span class="nav-icon">✉</span> Request Desk</a>
    <div class="sidebar-spacer"></div>
    <a class="nav-item nav-signout" onclick="signOut()" href="#"><span class="nav-icon">→</span> Sign Out</a>
  </nav>

  <main class="main">
    <p class="page-eyebrow">Request Desk</p>
    <h1 class="page-title">Got something on your mind?</h1>
    <p class="page-sub">Use this space to submit edit requests, ask questions, share ideas, or flag anything that needs attention. We'll follow up directly.</p>

    <!-- New Request -->
    <div class="new-request-card">
      <p class="card-title">New Request</p>
      <div class="form-row">
        <div class="form-field">
          <label>Subject</label>
          <input type="text" id="req-subject" placeholder="e.g. Update the tagline on the homepage">
        </div>
        <div class="form-field">
          <label>Type</label>
          <select id="req-type">
            <option value="general">General</option>
            <option value="revision">Revision</option>
            <option value="question">Question</option>
            <option value="idea">Idea</option>
          </select>
        </div>
      </div>
      <div class="form-field" style="margin-bottom:16px">
        <label>Message</label>
        <textarea id="req-message" placeholder="Share any details, links, or context that might help…"></textarea>
      </div>
      <button class="btn-submit" id="submitBtn" onclick="submitRequest()">Send Request</button>
    </div>

    <!-- Existing requests -->
    <p class="section-heading">Your Requests</p>
    <div id="requestsList"><p style="color:var(--cream-dim);font-size:13px">Loading…</p></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://krchnbfpqcibmcggjvtm.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_9dGqi3potpSMF3T7GUh3KA_Vvzsbsnn';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  let clientId = null;

  (async () => {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { window.location.href='/hq/'; return; }
    const { data:client } = await sb.from('clients').select('*').eq('user_id',session.user.id).single();
    if (!client) return;
    clientId = client.id;
    document.getElementById('sidebarBiz').textContent = client.business_name;
    loadRequests();
  })();

  async function loadRequests() {
    const { data:reqs } = await sb.from('requests').select('*').eq('client_id',clientId).order('created_at',{ascending:false});
    const list = reqs || [];
    const el = document.getElementById('requestsList');
    if (!list.length) {
      el.innerHTML = '<p style="color:var(--cream-dim);font-size:13px">No requests yet. Use the form above to get in touch.</p>';
      return;
    }
    el.innerHTML = '<div class="requests-list">'+list.map(r => {
      const badge = 'badge-'+r.status;
      const label = r.status==='open' ? 'Open' : r.status==='in_review' ? 'In Review' : 'Resolved';
      return `<div class="request-card">
        <div class="rc-header">
          <p class="rc-subject">${r.subject}</p>
          <span class="rc-badge ${badge}">${label}</span>
        </div>
        ${r.message ? `<p class="rc-message">${r.message}</p>` : ''}
        <p class="rc-meta">
          <span class="type-chip">${r.request_type}</span>
          Submitted ${new Date(r.created_at).toLocaleDateString('en-CA',{month:'long',day:'numeric',year:'numeric'})}
        </p>
      </div>`;
    }).join('')+'</div>';
  }

  async function submitRequest() {
    const subject = document.getElementById('req-subject').value.trim();
    const message = document.getElementById('req-message').value.trim();
    const type    = document.getElementById('req-type').value;
    if (!subject) { document.getElementById('req-subject').focus(); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Sending…';

    const { error } = await sb.from('requests').insert({ client_id:clientId, subject, message, request_type:type });
    btn.disabled = false; btn.textContent = 'Send Request';

    if (error) { showToast('Error: '+error.message); return; }
    document.getElementById('req-subject').value = '';
    document.getElementById('req-message').value = '';
    showToast('Request sent!');
    loadRequests();
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),3000);
  }

  async function signOut() { await sb.auth.signOut(); window.location.href='/hq/'; }
</script>
</body>
</html>
