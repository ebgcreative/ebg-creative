<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EBG HQ — Set Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --bg:#080810; --panel:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08); --cream:#EDE8E2; --cream-dim:rgba(237,232,226,0.55); --peri:#B8C9E8; --error:#E8A0A0; --success:#9ED4B4; }
    html,body { height:100%; background:var(--bg); color:var(--cream); font-family:'Jost',sans-serif; font-weight:300; }
    .wrap { min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px; }
    .card { width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:52px 44px 48px;backdrop-filter:blur(24px); }
    .mark { font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--peri);margin-bottom:32px; }
    .title { font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;margin-bottom:8px; }
    .title em { font-style:italic; }
    .sub { font-size:13px;color:var(--cream-dim);margin-bottom:36px;line-height:1.6; }
    .field { margin-bottom:20px; }
    .field label { display:block;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--cream-dim);margin-bottom:8px; }
    .field input { width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:13px 16px;font-family:'Jost',sans-serif;font-size:14px;font-weight:300;color:var(--cream);outline:none;transition:border-color 0.2s; }
    .field input:focus { border-color:var(--peri); }
    .btn { width:100%;padding:14px;background:var(--peri);color:#080810;border:none;border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s;margin-top:8px; }
    .btn:hover:not(:disabled) { opacity:0.85; }
    .btn:disabled { opacity:0.4;cursor:not-allowed; }
    .msg { margin-top:16px;padding:12px 16px;border-radius:8px;font-size:13px;display:none; }
    .msg.show { display:block; }
    .msg.error { background:rgba(232,160,160,0.1);border:1px solid rgba(232,160,160,0.25);color:var(--error); }
    .msg.success { background:rgba(158,212,180,0.1);border:1px solid rgba(158,212,180,0.25);color:var(--success); }
    .footer { margin-top:36px;padding-top:28px;border-top:1px solid var(--border);font-size:11px;color:rgba(237,232,226,0.3);text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="mark">EBG Creative</p>
      <h1 class="title">Set your <em>password.</em></h1>
      <p class="sub">Choose a strong password to secure your Brand HQ account.</p>
      <div class="field"><label>New Password</label><input type="password" id="pw1" placeholder="At least 8 characters"></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="pw2" placeholder="Repeat your password"></div>
      <button class="btn" id="setBtn" onclick="setPassword()">Set Password</button>
      <div class="msg" id="msg"></div>
      <p class="footer">© 2025 EBG Creative. All rights reserved.</p>
    </div>
  </div>
  <script>
    const SUPABASE_URL = 'https://krchnbfpqcibmcggjvtm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9dGqi3potpSMF3T7GUh3KA_Vvzsbsnn';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function setPassword() {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      const msg = document.getElementById('msg');
      msg.className = 'msg'; msg.style.display='none';
      if (pw1.length < 8) { showMsg('Password must be at least 8 characters.','error'); return; }
      if (pw1 !== pw2) { showMsg('Passwords do not match.','error'); return; }
      document.getElementById('setBtn').disabled = true;
      const { error } = await sb.auth.updateUser({ password: pw1 });
      document.getElementById('setBtn').disabled = false;
      if (error) { showMsg(error.message,'error'); return; }
      showMsg('Password set! Redirecting…','success');
      setTimeout(()=>window.location.href='/hq/',1800);
    }

    function showMsg(txt,type) {
      const el = document.getElementById('msg');
      el.textContent = txt;
      el.className = 'msg show '+type;
    }
  </script>
</body>
</html>
